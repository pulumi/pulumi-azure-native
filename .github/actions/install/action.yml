name: Install Languages & Frameworks
description: Installs Go, Pulumi, Node.JS Python and optionally dotnet and Java (if not in quick mode)

inputs:
  skip_dotnet_and_java:
    description: Set to "true" to skip dotnet and java
    # These take 13 and 25 seconds, respectively

runs:
  using: "composite"
  steps:
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "provider/go.mod"
        cache-dependency-path: |
          provider/go.sum
          examples/go.sum

    - name: Install Pulumi CLI
      uses: pulumi/actions@v6
      with:
        # Pinned to v3.230.0 (stable, released 2026-04-08). The `dev` channel
        # currently installs v3.231.0-alpha.* builds which contain
        # pulumi/pulumi#22569 ("Send Cancel RPC to plugins on host close for
        # graceful shutdown", merged 2026-04-13). That change breaks the
        # in-process attached providers used by pulumitest.NewPulumiTest +
        # opttest.AttachProvider, causing every e2e test under
        # provider/pkg/provider/ to fail with `context canceled` at the first
        # resource create. v3.230.0 predates the merge and is the last known-
        # good Pulumi CLI for these tests. See investigation notes in the
        # v2.92.2 release PR.
        #
        # This is a backport branch — it should not be tracking the dev
        # channel regardless of this specific regression.
        pulumi-version: v3.230.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: https://registry.npmjs.org

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Setup DotNet
      if: inputs.skip_dotnet_and_java != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Setup Java
      if: inputs.skip_dotnet_and_java != 'true'
      uses: actions/setup-java@v4
      with:
        java-version: "11"
        distribution: temurin
        cache: gradle

    - name: Setup Gradle
      if: inputs.skip_dotnet_and_java != 'true'
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: "8.13"
