name: Install Languages & Frameworks
description: Installs Go, Pulumi, Node.JS Python and optionally dotnet and Java (if not in quick mode)

inputs:
  skip_dotnet_and_java:
    description: Set to "true" to skip dotnet and java
    # These take 13 and 25 seconds, respectively

runs:
  using: "composite"
  steps:
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version-file: "provider/go.mod"
        cache-dependency-path: |
          provider/go.sum
          examples/go.sum

    - name: Install Pulumi CLI
      uses: pulumi/actions@v6
      with:
        # Pinned to v3.230.0 (stable, released 2026-04-08T20:50 UTC). The `dev`
        # channel currently installs v3.231.0-alpha.* builds which contain
        # pulumi/pulumi#22569 ("Send Cancel RPC to plugins on host close for
        # graceful shutdown", merged 2026-04-13T12:52 UTC). That PR breaks
        # in-process attached providers used by pulumitest.NewPulumiTest +
        # opttest.AttachProvider, causing `context canceled` at the first
        # resource create in every e2e test in provider/pkg/provider/.
        # v3.230.0 predates the merge and is the last known-good version for
        # these tests. This is a backport branch — we should not be tracking
        # the bleeding-edge dev channel anyway.
        pulumi-version: v3.230.0

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        registry-url: https://registry.npmjs.org

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Setup DotNet
      if: inputs.skip_dotnet_and_java != 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Setup Java
      if: inputs.skip_dotnet_and_java != 'true'
      uses: actions/setup-java@v4
      with:
        java-version: "11"
        distribution: temurin
        cache: gradle

    - name: Setup Gradle
      if: inputs.skip_dotnet_and_java != 'true'
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: "8.13"
