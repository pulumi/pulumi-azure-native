name: dev-version

on:
  workflow_call:
    outputs:
      version:
        description: Calculated version
        value: ${{ jobs.version.outputs.version }}


jobs:
  version:
    runs-on: ubuntu-latest
    name: Calculate Dev Version
    steps:
      - id: version
        name: Set hardcoded v2 dev version
        # The provider-version-action reads git tags and returns v3.x since v3 is the
        # latest major. On the v2 maintenance branch we hardcode a v2 dev version so
        # that MAJOR_VERSION stays 2 and codegen selects the correct v2 configuration.
        run: echo "VERSION=2.91.0-alpha.0+dev" >> "$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
