name: release

on:
  push:
    tags:
      - v2.*.*
    # Fire on pushes to this throwaway investigation branch so we can exercise
    # release.yml's build_test phase against the v2.92.0 baseline without opening
    # a PR or pushing a real tag. Remove this branch entry before merging anywhere.
    branches:
      - guin/v2.92.0-baseline

jobs:
  version:
    uses: ./.github/workflows/version.yml
    secrets: inherit

  build_test:
    uses: ./.github/workflows/build-test.yml
    needs: version
    secrets: inherit
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.version }}
      # We cannot run OIDC tests in the release workflow because it's not a PR and we don't have a
      # fixed tag or branch to serve as entity type, and we don't have Github environments
      # configured. See
      # https://learn.microsoft.com/en-us/azure/active-directory/workload-identities/workload-identity-federation-create-trust?pivots=identity-wif-apps-methods-azp#github-actions
      oidc_arm_client_id: ""
      upload_codecov: false

  publish:
    # Guard: only publish when triggered by an actual v2.*.* tag push, never on a
    # branch push. This prevents the throwaway branch trigger above from accidentally
    # pushing artifacts to npm/PyPI/NuGet/Maven/GH Releases when build_test passes.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    needs:
      - build_test
      - version
    with:
      ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ contains(github.ref_name,'-') }}

